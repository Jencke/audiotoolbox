name: Build and Deploy Documentation

on:
  push:
    branches:
      ["develop"] # or your default branch
    paths:
      - 'doc/**' # Trigger only on changes in the docs directory
      - 'src/**' # Trigger also on changes in the src directory
      - 'pyproject.toml' # Trigger also on changes to dependencies

  pull_request:
    branches:
      ["develop"]
    paths:
      - 'doc/**'
      - 'src/**'
      - 'pyproject.toml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Echo
        run: echo "Hello"

