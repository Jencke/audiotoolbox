name: CI

on:
  push:
    branches: [ "develop" ] # or whatever your main branch is
  pull_request:
    branches: [ "develop" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install .[dev] # Installs the project and development dependencies
    - name: Run pytest with coverage
      run: |
        coverage run --include=audiotoolbox/* -m pytest -ra
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3