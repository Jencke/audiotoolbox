# .github/workflows/publish-to-pypi.yml

name: Publish Python Package to PyPI

# 1. Trigger the workflow when a new release is created
on:
  release:
    types: [published]
  # Allow manual trigger
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build and publish Python distributions to PyPI
    if: github.event_name == 'release' # Only run on release trigger
    runs-on: ubuntu-latest

    # 2. Add permissions for trusted publishing
    permissions:
      id-token: write # Required for trusted publishing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      # 3. Publish the package to PyPI
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # This job only runs when you manually trigger it
  build-and-publish-to-testpypi:
    name: Build and publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' # Only run on manual trigger
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies and build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Point the action to the TestPyPI repository URL
          repository-url: https://test.pypi.org/legacy/        