name: Publish Python Package

# This section defines the triggers for the workflow.
on:
  # Run automatically when a new release is published
  release:
    types: [published]
  
  # Allow running this workflow manually from the Actions tab
  workflow_dispatch: {}

jobs:
  # This job publishes to the real PyPI.
  # It only runs when you create a release.
  build-and-publish:
    name: Build and publish to PyPI
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for trusted publishing
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies and build package
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # This job publishes to the TestPyPI repository.
  # It only runs when you trigger it manually.
  build-and-publish-to-testpypi:
    name: Build and publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for trusted publishing
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies and build package
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/